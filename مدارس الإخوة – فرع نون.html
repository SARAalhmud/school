<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدارس الإخوة – فرع نون</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f9;--card:#fff;--ink:#1b2a3a;--mut:#5d6f82;--line:#d8e0e8;--navy:#12395a;--teal:#1b7f96;--gold:#b8923a;--pri:#12395a;--on:#fff;--bad:#b3261e;--ok:#17703f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a26;--card:#15283a;--ink:#e8eef4;--mut:#9db0c2;--line:#27405a;--pri:#4fb3c9;--on:#082433}}
:root[data-theme="dark"]{--bg:#0e1a26;--card:#15283a;--ink:#e8eef4;--mut:#9db0c2;--line:#27405a;--pri:#4fb3c9;--on:#082433}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,sans-serif;line-height:1.8}
.topbar{background:var(--navy);color:#dbe7f1;font-size:14px;padding:6px 24px;display:flex;gap:22px;flex-wrap:wrap}
header{display:flex;align-items:center;gap:14px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:72px;height:64px;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.tt h1{font-size:21px;margin:0;font-weight:800;color:var(--ink);line-height:1.3}
.tt small{color:var(--mut);font-size:14px}
.sp{flex:1}
#nav{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nv{background:none;color:var(--ink);box-shadow:none;border-radius:0;padding:8px 14px;border-bottom:3px solid transparent;font-weight:500}
.nv:hover{border-bottom-color:var(--gold)}
.nv.go{background:var(--navy);color:#fff;border-radius:6px;border:0;margin-inline-start:8px}
#who{font-weight:700;color:var(--ink)}#who:empty{display:none}
main{max-width:1000px;margin:0 auto;padding:24px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:18px}
h2{font-size:21px;margin:0 0 14px;font-weight:800}
.sec h2{padding-bottom:8px;border-bottom:3px solid var(--gold);display:inline-block}
label{display:block;font-size:14px;margin:10px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;padding:10px 22px;border:0;border-radius:6px;background:var(--pri);color:var(--on);cursor:pointer}
button.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
button.sm{padding:4px 12px;font-size:13px}
.login{max-width:420px;margin:20px auto;text-align:center}
.biglogo{width:130px;height:auto;margin:0 auto 6px;display:block}
.login form{text-align:right}.login button{width:100%;margin-top:10px}
.err{color:var(--bad);font-size:14px;min-height:22px;margin-top:8px}
.ok{color:var(--ok);font-size:15px;font-weight:700;margin-inline-start:12px}
.hint{font-size:13px;color:var(--mut);border-top:1px dashed var(--line);margin-top:16px;padding-top:10px;text-align:right}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tabs button{background:none;color:var(--mut);border-radius:0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;background:var(--bg)}
td input{width:96px}
.chk{display:flex;gap:10px;flex-wrap:wrap}.chk label{display:flex;gap:4px;align-items:center;margin:0;color:var(--ink)}.chk input{width:auto}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
[hidden]{display:none!important}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-bottom:8px}
.info p{margin:8px 0}
.msg{border-bottom:1px solid var(--line);padding:10px 0}.msg small{color:var(--mut)}
footer:empty{display:none}
footer{background:var(--navy);color:#cfdce8;padding:28px 24px 18px;font-size:14px}
.fg{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
footer h3{color:#fff;margin:0 0 8px;font-size:16px}footer p{margin:4px 0}
footer .lk{background:none;color:#cfdce8;padding:2px 0;display:block;font-weight:400}
.copy{text-align:center;border-top:1px solid rgba(255,255,255,.18);margin-top:18px;padding-top:12px}

:root{--b:#1769c9;--t:#12a4b8;--g:#2bb673;--y:#ffb703;--c:#ff6b4a;--p:#7b5cd6;--k:#e0508f;--soft:#e8f2fc;--navy:#0f4c9a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soft:#12304c}}
:root[data-theme="dark"]{--soft:#12304c}
header{border-top:6px solid;border-image:linear-gradient(90deg,#ffb703,#ff6b4a,#12a4b8,#1769c9) 1}
main.home{max-width:none;padding:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
.hero{position:relative;color:#fff;padding:48px 0 90px;background:radial-gradient(circle at 12% 20%,rgba(255,255,255,.12) 0 90px,transparent 91px),radial-gradient(circle at 60% 90%,rgba(255,183,3,.25) 0 120px,transparent 121px),linear-gradient(160deg,#1769c9,#12a4b8)}
.hg{display:grid;grid-template-columns:1fr 1.05fr;gap:20px;align-items:center}
.hero h2{font-size:42px;line-height:1.35;margin:0 0 14px;font-weight:800}
.hero p{font-size:18px;margin:0 0 24px;max-width:44ch}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.hero .b1{background:var(--y);color:#10304f;padding:13px 26px;font-size:17px;border-radius:8px}
.hero .b2{background:none;border:2px solid #fff;color:#fff;padding:11px 24px;font-size:17px;border-radius:8px}
.hero>svg.wave{position:absolute;bottom:-1px;left:0;width:100%;height:60px;display:block}
.hero .art{width:100%;height:auto}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:-52px;position:relative;z-index:2}
.tile{border-radius:14px;color:#fff;padding:22px 20px;text-align:right;display:block;width:100%;font-size:20px;font-weight:800;border:0;box-shadow:0 8px 20px rgba(15,76,154,.2);transition:transform .15s}
.tile:hover{transform:translateY(-4px)}
.tile small{display:block;font-weight:400;font-size:14px;opacity:.95;margin-top:2px}
.tile svg{width:46px;height:46px;fill:currentColor;display:block;margin-bottom:10px;background:rgba(255,255,255,.22);border-radius:12px;padding:9px}
.tile.y{color:#10304f}.tile.y svg{background:rgba(16,48,79,.12)}
.part{padding:48px 0}
.st{text-align:center;font-size:28px;margin:0 0 26px;font-weight:800}
.st::after{content:"";display:block;width:90px;height:5px;border-radius:3px;margin:10px auto 0;background:linear-gradient(90deg,var(--y),var(--c),var(--t),var(--b))}
.about{display:grid;grid-template-columns:1.4fr .6fr;gap:30px;align-items:center}
.about p{font-size:17px;margin:0 0 12px}
.badge{background:var(--soft);border-radius:18px;padding:22px;text-align:center;border:3px dashed var(--t)}
.badge img{width:100%;max-width:200px}
.band{background:linear-gradient(120deg,#0f4c9a,#12a4b8);color:#fff;padding:34px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;text-align:center}
.stats b{display:block;font-size:44px;line-height:1.2;color:var(--y)}
.grades{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.gr{background:var(--card);border-radius:14px;border:1px solid var(--line);border-bottom:6px solid var(--k);padding:18px;display:flex;gap:14px;align-items:center}
.gr i{font-style:normal;flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}
.gr b{display:block}.gr small{color:var(--mut)}
.subj{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.subj span{padding:9px 20px;border-radius:99px;color:#fff;font-weight:700}
.contact{background:var(--soft)}
@media (max-width:760px){.hg,.about{grid-template-columns:1fr}.hero h2{font-size:30px}.hero{padding:30px 0 80px}}
footer{background:#0c3a73}
</style>
</head>
<body>
<div class="topbar" id="top"></div>
<header>
  <div class="logo"><img id="lg" alt="شعار مدارس الإخوة"></div>
  <div class="tt"><h1>مدارس الإخوة الابتدائية</h1><small>فرع نون</small></div>
  <div class="sp"></div><nav id="nav"></nav>
  <span id="who"></span>
  <button class="ghost sm" id="out" hidden>تسجيل الخروج</button>
</header>
<main id="app"></main>
<footer id="ft"></footer>

<div class="badge"><img src="${LOGO}" alt="شعار المدرسة"></div></div></div></section>
<section class="band"><div class="wrap stats"><div><b>7</b>صفوف دراسية</div><div><b>4</b>صفوف بمعلمة صف</div><div><b>3</b>صفوف بمعلمات اختصاص</div><div><b>7</b>مواد دراسية</div></div></section>
<section class="part" id="grades"><div class="wrap"><h2 class="st">صفوفنا</h2><div class="grades">
${GRADES.map((n,i)=>`<div class="gr" style="border-bottom-color:${COL[i]}"><i style="background:${COL[i]}">${i+1}</i><div><b>الصف ${n}</b><small>${i<4?'معلمة صف':'معلمات اختصاص'}</small></div></div>`).join('')}</div></div></section>
<section class="part" style="padding-top:0"><div class="wrap"><h2 class="st">موادنا الدراسية</h2><div class="subj">${ALL.map((x,i)=>`<span style="background:${COL[i%7]}">${x}</span>`).join('')}</div></div></section>
<section class="part contact" id="contact"><div class="wrap"><h2 class="st">تواصل معنا</h2>
<div class="two"><div class="card info">${ci.length?ci.map(x=>`<p>${esc(x)}</p>`).join(''):'<p>سيتم نشر بيانات التواصل قريباً. يمكنك إرسال رسالتك عبر النموذج وستصل إلى الإدارة.</p>'}</div>
<div class="card"><form id="cf"><label for="cn">الاسم</label><input id="cn" required>
<label for="cp">رقم الهاتف</label><input id="cp" type="tel" required><label for="ct">الرسالة</label><textarea id="ct" rows="3" required></textarea>
<p><button type="submit">إرسال</button><span class="ok" id="cmsg" role="status"></span></p></form></div></div></div></section>`}
function footerHtml(){const ci=contactItems();return `<div class="fg"><div><h3>مدارس الإخوة الابتدائية – فرع نون</h3><p>من الصف الأول إلى السابع</p></div>
<div><h3>روابط سريعة</h3><button class="lk" data-p="home">الرئيسية</button><button class="lk" data-p="login">دخول الطالبات والمعلمات</button><button class="lk" data-p="contact">تواصل معنا</button></div>
<div><h3>التواصل</h3>${ci.map(x=>`<p>${esc(x)}</p>`).join('')||'<p>عبر نموذج التواصل في الصفحة</p>'}</div></div>
<div class="copy">© مدارس الإخوة الابتدائية – فرع نون. جميع الحقوق محفوظة.</div>`}
function sendMsg(e){e.preventDefault();db.msgs=db.msgs||[];
  db.msgs.unshift({name:$('#cn').value.trim(),phone:$('#cp').value.trim(),text:$('#ct').value.trim(),at:new Date().toLocaleDateString('ar')});
  save();$('#cf').reset();$('#cmsg').textContent='وصلت رسالتك، رح نرد عليكِ قريباً.'}
function msgsPane(){const m=db.msgs||[];
  $('#pane').innerHTML=`<div class="card"><h2>رسائل التواصل (${m.length})</h2>${m.length?m.map(x=>`<div class="msg"><b>${esc(x.name)}</b> – ${esc(x.phone)} <small>${esc(x.at)}</small><div>${esc(x.text)}</div></div>`).join(''):'<p>ما وصلت رسائل بعد.</p>'}</div>`}


const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gname=g=>'الصف '+GRADES[g-1];

function render(){
  $('#out').hidden=!me;
  $('#who').textContent=me?me.name:'';
  $('#nav').innerHTML=me?'':NAVHTML;$('#ft').innerHTML=(!me&&page==='home')?footerHtml():'';{const t=me?[]:contactItems();$('#top').innerHTML=t.map(x=>`<span>${esc(x)}</span>`).join('');$('#top').hidden=!t.length}const app=$('#app');app.className=(!me&&page==='home')?'home':'';
  if(!me){if(page==='login'){app.innerHTML=loginView();$('#f').onsubmit=doLogin}else{app.innerHTML=homeView();$('#cf').onsubmit=sendMsg}bindNav();return}
  if(me.role==='admin')adminView(app);
  else if(me.role==='teacher')teacherView(app);
  else studentView(app);
}

function loginView(){return `<div class="card login"><img class="biglogo" src="${LOGO}" alt="شعار مدارس الإخوة"><h2>تسجيل الدخول</h2>
<form id="f"><label for="em">البريد الإلكتروني</label><input id="em" type="email" required autocomplete="username">
<label for="pw">كلمة السر</label><input id="pw" type="password" required autocomplete="current-password">
<div class="err" id="err" role="alert"></div><button type="submit">دخول</button></form>
<div class="hint">حسابات تجريبية: admin@nun.edu / admin123 (إدارة)، sana@nun.edu / 1234 (معلمة صف)، rima@nun.edu / 1234 (معلمة اختصاص)، lian@nun.edu / 1234 (طالبة)</div></div>`}

function doLogin(e){
  e.preventDefault();
  const em=$('#em').value.trim().toLowerCase(),pw=$('#pw').value;
  const u=db.users.find(x=>x.email.toLowerCase()===em&&x.pass===pw);
  if(!u){$('#err').textContent='البريد أو كلمة السر غير صحيحة. تأكدي منهما وحاولي مرة ثانية.';return}
  me=u;tab='';render();
}
$('#out').onclick=()=>{me=null;page='home';render()};

/* ---------- الطالبة ---------- */
function subjectsFor(g){return ALL}
function studentView(app){
  const m=(db.marks[me.email]||{});
  const rows=subjectsFor(me.grade).map(s=>{
    const v=m[s];
    return `<tr><td>${s}</td><td>${v==null?'—':v}</td><td>${v==null?'':(v>=50?'<span class="pass">ناجحة</span>':'<span class="fail">راسبة</span>')}</td></tr>`}).join('');
  app.innerHTML=`<div class="card"><h2>علاماتي – ${gname(me.grade)}</h2><div class="tw"><table><tr><th>المادة</th><th>العلامة من 100</th><th>الحالة</th></tr>${rows}</table></div></div>`;
}

/* ---------- المعلمة ---------- */
function teacherView(app){
  const opts=[];
  me.grades.forEach(g=>me.subjects.forEach(s=>opts.push({g,s})));
  const kindTxt=me.kind==='class'?`معلمة صف – ${gname(me.classGrade)}`:`معلمة اختصاص – ${me.subjects.join('، ')}`;
  app.innerHTML=`<div class="card"><h2>إدخال العلامات</h2><p style="color:var(--mut);margin:0 0 8px">${kindTxt}</p>
  <label for="sel">الصف والمادة</label>
  <select id="sel">${opts.map((o,i)=>`<option value="${i}">${gname(o.g)} – ${o.s}</option>`).join('')}</select></div>
  <div class="card" id="sheet"></div>`;
  const draw=()=>{
    const o=opts[$('#sel').value];
    const sts=db.users.filter(u=>u.role==='student'&&u.grade===o.g);
    if(!sts.length){$('#sheet').innerHTML='<p>ما في طالبات مسجلات بهذا الصف بعد. الإدارة بتضيفهن من لوحة الإدارة.</p>';return}
    $('#sheet').innerHTML=`<div class="tw"><table><tr><th>الطالبة</th><th>العلامة (0–100)</th></tr>${sts.map(s=>`<tr><td>${esc(s.name)}</td><td><input type="number" min="0" max="100" data-e="${esc(s.email)}" value="${(db.marks[s.email]||{})[o.s]??''}" aria-label="علامة ${esc(s.name)}"></td></tr>`).join('')}</table></div>
    <p><button id="sv">حفظ العلامات</button><span class="ok" id="msg"></span></p>`;
    $('#sv').onclick=()=>{
      document.querySelectorAll('#sheet input[data-e]').forEach(i=>{
        const e=i.dataset.e;db.marks[e]=db.marks[e]||{};
        if(i.value==='')delete db.marks[e][o.s];
        else db.marks[e][o.s]=Math.min(100,Math.max(0,Number(i.value)));
      });
      save();$('#msg').textContent='تم حفظ العلامات';
    };
  };
  $('#sel').onchange=draw;draw();
}

/* ---------- الإدارة ---------- */
function adminView(app){
  tab=tab||'t';
  app.innerHTML=`<div class="tabs"><button data-t="t" class="${tab==='t'?'on':''}">المعلمات</button><button data-t="s" class="${tab==='s'?'on':''}">الطالبات</button><button data-t="m" class="${tab==='m'?'on':''}">الرسائل</button></div><div id="pane"></div>`;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  ({t:teachersPane,s:studentsPane,m:msgsPane})[tab]();
}
function emailTaken(e){return db.users.some(u=>u.email.toLowerCase()===e.toLowerCase())}

function teachersPane(){
  const list=db.users.filter(u=>u.role==='teacher');
  $('#pane').innerHTML=`<div class="card"><h2>إضافة معلمة</h2><form id="tf">
  <div class="row"><div><label for="tn">الاسم</label><input id="tn" required></div>
  <div><label for="te">البريد الإلكتروني</label><input id="te" type="email" required></div>
  <div><label for="tp">كلمة السر</label><input id="tp" required minlength="4"></div></div>
  <label for="tk">نوع المعلمة</label>
  <select id="tk"><option value="class">معلمة صف (من الأول إلى الرابع)</option><option value="spec">معلمة اختصاص (مادة واحدة)</option></select>
  <div id="kc"><label for="tg">الصف</label><select id="tg">${[1,2,3,4].map(g=>`<option value="${g}">${gname(g)}</option>`).join('')}</select>
  <p class="hint" style="border:0;margin:6px 0 0">معلمة الصف بتدرّس كل المواد ما عدا الإنكليزي والمعلوماتية.</p></div>
  <div id="ks" hidden><label for="ts">المادة</label><select id="ts">${ALL.map(s=>`<option>${s}</option>`).join('')}</select>
  <label>الصفوف</label><div class="chk">${GRADES.map((n,i)=>`<label><input type="checkbox" value="${i+1}" class="gc">${n}</label>`).join('')}</div></div>
  <div class="err" id="terr" role="alert"></div><button type="submit">إضافة المعلمة</button></form></div>
  <div class="card"><h2>المعلمات (${list.length})</h2><div class="tw"><table><tr><th>الاسم</th><th>البريد</th><th>التدريس</th><th></th></tr>
  ${list.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.email)}</td><td>${t.kind==='class'?'صف: '+gname(t.classGrade):esc(t.subjects[0])+' ('+t.grades.map(g=>GRADES[g-1]).join('، ')+')'}</td><td><button class="ghost sm" data-d="${esc(t.email)}">حذف</button></td></tr>`).join('')}</table></div></div>`;
  $('#tk').onchange=()=>{const c=$('#tk').value==='class';$('#kc').hidden=!c;$('#ks').hidden=c};
  $('#tf').onsubmit=e=>{
    e.preventDefault();
    const email=$('#te').value.trim(),kind=$('#tk').value;
    if(emailTaken(email)){$('#terr').textContent='هذا البريد مستخدم مسبقاً.';return}
    const u={name:$('#tn').value.trim(),email,pass:$('#tp').value,role:'teacher',kind};
    if(kind==='class'){u.classGrade=+$('#tg').value;u.grades=[u.classGrade];u.subjects=SUBJ_CLASS}
    else{u.subjects=[$('#ts').value];u.grades=[...document.querySelectorAll('.gc:checked')].map(c=>+c.value);
      if(!u.grades.length){$('#terr').textContent='اختاري صفاً واحداً على الأقل.';return}}
    db.users.push(u);save();render();
  };
  delBtns(teachersPane);
}
function studentsPane(){
  const list=db.users.filter(u=>u.role==='student').sort((a,b)=>a.grade-b.grade);
  $('#pane').innerHTML=`<div class="card"><h2>إضافة طالبة</h2><form id="sf"><div class="row">
  <div><label for="sn">الاسم</label><input id="sn" required></div>
  <div><label for="se">البريد الإلكتروني</label><input id="se" type="email" required></div>
  <div><label for="sp">كلمة السر</label><input id="sp" required minlength="4"></div>
  <div><label for="sg">الصف</label><select id="sg">${GRADES.map((n,i)=>`<option value="${i+1}">${gname(i+1)}</option>`).join('')}</select></div></div>
  <div class="err" id="serr" role="alert"></div><button type="submit">إضافة الطالبة</button></form></div>
  <div class="card"><h2>الطالبات (${list.length})</h2><div class="tw"><table><tr><th>الاسم</th><th>البريد</th><th>الصف</th><th></th></tr>
  ${list.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${gname(s.grade)}</td><td><button class="ghost sm" data-d="${esc(s.email)}">حذف</button></td></tr>`).join('')}</table></div></div>`;
  $('#sf').onsubmit=e=>{
    e.preventDefault();const email=$('#se').value.trim();
    if(emailTaken(email)){$('#serr').textContent='هذا البريد مستخدم مسبقاً.';return}
    db.users.push({name:$('#sn').value.trim(),email,pass:$('#sp').value,role:'student',grade:+$('#sg').value});
    save();render();
  };
  delBtns(studentsPane);
}
function delBtns(){
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    if(!confirm('متأكدة من الحذف؟'))return;
    db.users=db.users.filter(u=>u.email!==b.dataset.d);delete db.marks[b.dataset.d];save();render();
  });
}
render();
</script>
</body>
</html>
